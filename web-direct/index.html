<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🤖</text></svg>" />

  <!-- highlight.js 代码高亮主题（GitHub 风格，明亮清爽） -->
  <link rel="stylesheet" href="lib/hljs/github.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ========== 整体布局 ========== */
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6fa; height: 100vh; display: flex; flex-direction: column;
    }

    /* ========== 顶部栏 ========== */
    .header {
      background: #4f46e5; color: #fff; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header .left { display: flex; flex-direction: column; gap: 2px; }
    .header h1 { font-size: 17px; font-weight: 600; }
    .header .meta { font-size: 11px; opacity: .85; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-new { background: rgba(255,255,255,.15); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .btn-new:hover { background: rgba(255,255,255,.28); }

    /* ========== 消息列表 ========== */
    .chat { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { display: flex; margin-bottom: 18px; }
    .msg.user { justify-content: flex-end; }

    /* ========== 气泡基础样式 ========== */
    .bubble {
      max-width: 78%; padding: 12px 16px; border-radius: 14px;
      font-size: 14px; line-height: 1.75; word-break: break-word;
    }
    .msg.user .bubble {
      background: #4f46e5; color: #fff; border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: #fff; color: #1f2937; border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    .msg.error .bubble { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .msg.typing .bubble { color: #9ca3af; }

    /* ========== Markdown 富文本排版 ========== */
    /* 模块间距：段落之间、标题与正文之间保持疏朗 */
    .bubble.markdown p  { margin: 0 0 10px; }
    .bubble.markdown p:last-child { margin-bottom: 0; }

    /* 标题：清晰分层，不同模块自然分隔 */
    .bubble.markdown h1, .bubble.markdown h2,
    .bubble.markdown h3, .bubble.markdown h4 {
      font-weight: 600; margin: 18px 0 8px; line-height: 1.4;
    }
    .bubble.markdown h1 { font-size: 17px; }
    .bubble.markdown h2 { font-size: 15px; }
    .bubble.markdown h3 { font-size: 14px; }
    .bubble.markdown h4 { font-size: 14px; color: #6b7280; }
    .bubble.markdown :first-child { margin-top: 0; }
    .bubble.markdown :last-child  { margin-bottom: 0; }

    /* 无序 & 有序列表：层级清晰、缩进恰当 */
    .bubble.markdown ul, .bubble.markdown ol {
      margin: 6px 0 10px; padding-left: 22px;
    }
    .bubble.markdown li { margin: 4px 0; }
    .bubble.markdown li::marker { color: #4f46e5; }

    /* 加粗：醒目但不过重 */
    .bubble.markdown strong { font-weight: 600; color: #111827; }

    /* 行内代码 */
    .bubble.markdown code {
      background: #f3f4f6; color: #be185d; padding: 2px 6px;
      border-radius: 4px; font-size: 13px; font-family: Consolas, "Source Code Pro", monospace;
    }

    /* 代码块：配合 highlight.js，浅灰背景 + 圆角卡片 */
    .bubble.markdown pre {
      background: #f8f9fa; padding: 0; border-radius: 8px;
      overflow-x: auto; margin: 10px 0; border: 1px solid #e5e7eb;
    }
    .bubble.markdown pre code {
      background: transparent; color: inherit; padding: 12px 14px;
      display: block; font-size: 13px; line-height: 1.6;
    }
    /* highlight.js 覆盖：去掉它自带的 padding（pre code 已控制） */
    .bubble.markdown pre code.hljs { padding: 12px 14px; }

    /* 引用块：左侧色条，适合突出提示 */
    .bubble.markdown blockquote {
      border-left: 3px solid #4f46e5; background: #f5f3ff;
      padding: 8px 12px; margin: 10px 0; border-radius: 0 6px 6px 0;
      color: #4338ca; font-size: 13px;
    }
    .bubble.markdown blockquote p { margin: 0; }

    /* 链接 */
    .bubble.markdown a { color: #4f46e5; text-decoration: underline; }

    /* 表格：强制竖排堆叠，每格独占一行（避免宽表格横向溢出） */
    .bubble.markdown table { display: block; margin: 10px 0; width: 100%; }
    .bubble.markdown thead { display: block; }
    .bubble.markdown tbody { display: block; }
    .bubble.markdown tr { display: block; margin-bottom: 6px; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
    .bubble.markdown th, .bubble.markdown td {
      display: block; padding: 6px 10px; font-size: 13px; text-align: left;
    }
    .bubble.markdown th { background: #f3f4f6; font-weight: 600; border-bottom: 1px solid #e5e7eb; }
    .bubble.markdown td { background: #fff; }

    /* JS 表格转竖排列表（table → .table-list） */
    .bubble.markdown .table-list { margin: 10px 0; }
    .bubble.markdown .table-list-item {
      padding: 6px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px;
    }
    .bubble.markdown .table-list-item:last-child { border-bottom: none; }
    .bubble.markdown .table-list-key {
      font-weight: 600; color: #374151; background: #f3f4f6;
      padding: 1px 6px; border-radius: 3px;
    }
    .bubble.markdown .table-list-val { color: #1f2937; }

    /* 水平分隔线 */
    .bubble.markdown hr { border: none; border-top: 1px solid #e5e7eb; margin: 14px 0; }

    /* 图片 */
    .bubble.markdown img { max-width: 100%; border-radius: 8px; margin: 6px 0; }

    /* 用户气泡中的代码 */
    .msg.user .bubble code { background: rgba(255,255,255,.15); color: #fff; }
    .msg.user .bubble pre { background: rgba(0,0,0,.12); border-color: rgba(255,255,255,.1); }

    /* ========== 欢迎语 & 输入栏 ========== */
    .welcome { text-align: center; color: #9ca3af; margin-top: 80px; font-size: 14px; }
    .input-bar { border-top: 1px solid #e5e7eb; background: #fff; padding: 12px 16px; display: flex; gap: 10px; }
    .input-bar input {
      flex: 1; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 14px;
      font-size: 14px; outline: none; transition: border-color .2s;
    }
    .input-bar input:focus { border-color: #4f46e5; }
    .input-bar button {
      background: #4f46e5; color: #fff; border: none; border-radius: 10px;
      padding: 10px 22px; font-size: 14px; cursor: pointer; transition: background .15s;
    }
    .input-bar button:hover { background: #4338ca; }
    .input-bar button:disabled { background: #a5b4fc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div class="left">
      <h1>🤖 AI 助手</h1>
      <div class="meta" id="convMeta">conversation_id: 暂无（首条消息后生成，用于保持上下文）</div>
    </div>
    <button class="btn-new" onclick="newConversation()">＋ 新对话</button>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">你好，我是 AI 助手，有什么可以帮你？</div>
  </div>

  <div class="input-bar">
    <input id="input" placeholder="输入你的问题…" autocomplete="off" />
    <button id="btnSend" onclick="send()">发送</button>
  </div>

  <!-- GitHub Pages 直连版：浏览器直接调用 Dify API（无后端中转），
        API 密钥配置在 app.js 顶部（仅供个人演示）。
       插件：DOMPurify（XSS 净化）、marked（Markdown 渲染）、highlight.js（代码高亮） -->

  <script src="lib/purify.min.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="lib/hljs/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
